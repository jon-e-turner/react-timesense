name: ESLint

on:
  - workflow_call

jobs:
  eslint:
    name: Run linter
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint
