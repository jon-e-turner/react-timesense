name: 'Prettier'
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  prettier:
    name: Format code
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up problem matcher
        run: echo "::add-matcher::.github/workflows/prettier-write-problem-matcher.json"

      - name: Run prettier
        run: npm run format
